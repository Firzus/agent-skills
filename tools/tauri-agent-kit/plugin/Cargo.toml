[package]
name = "tauri-plugin-agent-kit"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"
links = "tauri-plugin-agent-kit"
build = "build.rs"
description = "Unofficial Windows WebView2 diagnostics and automation bridge for Tauri 2"
repository = "https://github.com/Firzus/agent-skills"
readme = "README.md"
keywords = ["tauri", "mcp", "webview2", "diagnostics"]
categories = ["development-tools::debugging"]
include = ["src/**", "build.rs", "permissions/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Storage_FileSystem",
] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
