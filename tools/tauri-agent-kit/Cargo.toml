[workspace]
members = ["plugin", "fixtures/basic/src-tauri"]
resolver = "2"

[workspace.dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
] }
